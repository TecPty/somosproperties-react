schema: spec-driven

context: |
  Tech stack: Next.js 16 (App Router), React 19, TypeScript 5, Tailwind CSS v4
  Architecture: App Router with [locale] for i18n (next-intl v4)
  i18n: next-intl v4, locales: [es, en], defaultLocale: es
  Data: Static JSON in data/properties.json
  Testing: No test runner installed
  Style: ESLint, standard React/Next patterns

strict_tdd: false

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
    - Note when a change affects SEO or i18n routing
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
    - Never use hardcoded strings — use CONTACT constants or i18n
  verify:
    - Run tests if test infrastructure exists (currently unavailable)
    - Compare implementation against every spec scenario
    - Check that metadata uses generateMetadata for i18n pages
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  strict_tdd: false
  test_runner:
    available: false
    command: null
    framework: null
  layers:
    unit: { available: false, tool: null }
    integration: { available: false, tool: null }
    e2e: { available: false, tool: null }
  coverage:
    available: false
    command: null
  quality:
    linter: { available: true, command: "npm run lint" }
    type_checker: { available: true, command: "tsc --noEmit" }
    formatter: { available: false, command: null }
